[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uv run excalibur ship"
restartPolicyType = "NEVER"

# Manual-only runs for now. Trigger with:
#   railway run -- uv run excalibur ship
# or use the Railway dashboard's "Run" button. To enable nightly cron,
# uncomment the block below.
#
# [[cron]]
# schedule = "0 22 * * *"  # 22:00 UTC = 18:00 EDT
# command = "uv run excalibur ship"
